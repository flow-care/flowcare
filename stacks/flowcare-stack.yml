# ============================================================
# Flowcare — stack de PRODUÇÃO (Docker Swarm)
# Deploy: workflow_dispatch → infra/deploy.sh → docker stack deploy.
#
# Decisões do time (issues #3/#5/#7):
#   - Postgres roda DENTRO da stack (sem serviço externo), rede interna flowcare_net.
#   - Sem ambiente de staging — só produção.
#   - WAHA NÃO está aqui: é a stack `waha` já existente (docs/infra/WAHA.md).
#
# Requisitos no host (docs/infra/DEPLOY.md):
#   - /root/flowcare/.env  (variáveis de produção — docs/infra/SECRETS.md)
#   - rede externa traefik-public já criada
#   - FLOWCARE_TAG exportado no deploy (sha do commit)
#
# DNS interno da stack: postgres = `flowcare_postgres` (usado no DATABASE_URL).
# ============================================================

x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    env_file: /root/flowcare/.env
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300s
      - -c
      - archive_command=/usr/local/bin/archive-wal.sh "%p" "%f"
    volumes:
      - flowcare_postgres_data:/var/lib/postgresql/data
      - /root/flowcare/wal-spool:/wal-archive
      - /root/flowcare/infra/backup/archive-wal.sh:/usr/local/bin/archive-wal.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - flowcare_net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 1g
    logging: *logging

  api:
    image: ghcr.io/flow-care/flowcare-api:${FLOWCARE_TAG:?FLOWCARE_TAG e obrigatorio (infra/deploy.sh exporta)}
    env_file: /root/flowcare/.env
    environment:
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:390403879931:flowcare-ses-events
      SES_CONFIGURATION_SET: flowcare-transactional
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - flowcare_net
      - traefik-public
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        - traefik.http.routers.flowcare-api.rule=Host(`${API_HOST:?Defina API_HOST no .env}`)
        - traefik.http.routers.flowcare-api.entrypoints=websecure
        - traefik.http.routers.flowcare-api.tls=true
        - traefik.http.routers.flowcare-api.tls.certresolver=letsencrypt
        - traefik.http.services.flowcare-api.loadbalancer.server.port=3000
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 768m
    logging: *logging

  web:
    image: ghcr.io/flow-care/flowcare-web:${FLOWCARE_TAG:?FLOWCARE_TAG e obrigatorio (infra/deploy.sh exporta)}
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:?Defina API_INTERNAL_URL no .env}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - flowcare_net # permite SSR chamar a api por `flowcare_api:3000`
      - traefik-public
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        - traefik.http.routers.flowcare-web.rule=(Host(`${WEB_HOST:?Defina WEB_HOST no .env}`) || Host(`${WEB_ALT_HOST:?Defina WEB_ALT_HOST no .env}`))
        - traefik.http.routers.flowcare-web.entrypoints=websecure
        - traefik.http.routers.flowcare-web.tls=true
        - traefik.http.routers.flowcare-web.tls.certresolver=letsencrypt
        - traefik.http.services.flowcare-web.loadbalancer.server.port=3000
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 512m
    logging: *logging

volumes:
  flowcare_postgres_data:

networks:
  flowcare_net:
    driver: overlay
  traefik-public:
    external: true
