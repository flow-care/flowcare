# ============================================================
# Flowcare — ambiente de desenvolvimento local
# Uso: docker compose -f docker-compose.dev.yml up -d
#   - Postgres 16 (extensões via docker/postgres/initdb)
#   - API com hot-reload em http://localhost:3001
# O front roda nativo (bun dev → http://localhost:3000), fora do compose:
#   mais rápido e com HMR limpo. Web/app remoto usam o WAHA de prod
#   (ou nada — /health reporta waha:down, o que é aceitável em dev).
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - flowcare_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: oven/bun:1.4
    working_dir: /app/apps/api
    command: bun --hot src/index.ts
    ports:
      - "3001:3000"
    volumes:
      - ./:/app
    environment:
      NODE_ENV: development
      APP_VERSION: 0.1.0-dev
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Defina DOCKER_DATABASE_URL no .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?Defina CORS_ORIGIN no .env}
      APP_WEB_URL: ${APP_WEB_URL:?Defina APP_WEB_URL no .env}
      WAHA_BASE_URL: ${DOCKER_WAHA_BASE_URL:?Defina DOCKER_WAHA_BASE_URL no .env}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET:-}
      WHATSAPP_SEND_ENABLED: ${WHATSAPP_SEND_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  flowcare_dev_pgdata:
